name: Signature heart E2E
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  heart:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.51.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Verify signature heart
        run: |
          cat > heart-e2e.js <<'EOF'
          const { chromium } = require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const LEFT='M8 58 C32 88 68 89 99 73 C114 65 129 64 137 77 C121 63 109 53 105 41 C101 28 108 19 119 18 C127 17 134 21 137 27';
          const RIGHT='M155 27 C158 21 165 17 173 18 C184 19 191 28 187 41 C183 53 171 63 155 77 C163 64 178 65 193 73 C224 89 260 88 284 58';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('https://minukimi-ux-test.onrender.com/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.evaluate(()=>{localStorage.setItem('mk_onboarded_v12','1');localStorage.setItem('mk_profile_v12',JSON.stringify({name:'Alex',age:34,city:'Lisbon',job:'Designer',looking:'Everyone',goal:'Long-term relationship',prompt:'already living near the sea, wearing linen and kissing first.',photo:'',photoOk:true,focusX:50,focusY:30,zoom:1}))});
            await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('#discover.active');
            assert((await page.locator('#leftHalf .sig-line').getAttribute('d'))===LEFT,'left geometry changed');
            assert((await page.locator('#rightHalf .sig-line').getAttribute('d'))===RIGHT,'right geometry changed');
            const bg=await page.locator('.heart-zone').evaluate(el=>getComputedStyle(el).backgroundColor);
            assert(bg==='rgba(0, 0, 0, 0)','heart panel is not transparent');
            await page.screenshot({path:'heart-rest.png',fullPage:true});
            await page.locator('.connect-pill').click();
            await page.waitForSelector('#connection.connected',{timeout:3000});
            const lt=await page.locator('#leftHalf').getAttribute('style');
            const rt=await page.locator('#rightHalf').getAttribute('style');
            assert((lt||'').includes('translateX(9px)'),'left half did not connect');
            assert((rt||'').includes('translateX(-9px)'),'right half did not connect');
            await page.screenshot({path:'heart-connected.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node heart-e2e.js
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signature-heart-screens
          path: heart-*.png
          if-no-files-found: ignore
