name: Public smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render and verify health
        run: |
          set -euo pipefail
          URL="https://minukimi-ux-test.onrender.com"
          for i in {1..24}; do
            BODY=$(curl -fsS --max-time 20 "$URL/api/health" || true)
            if [[ "$BODY" == *'"ok": true'* && "$BODY" == *'"database": "postgres"'* ]]; then break; fi
            sleep 10
          done
          HTML=$(curl -fsS --max-time 30 "$URL/")
          [[ "$HTML" == *"Someone you haven't met yet."* ]]
          [[ "$HTML" == *"Don't swipe right. Connect."* ]]
          [[ "$HTML" == *'id="profilePhoto"'* ]]
          [[ "$HTML" == *'id="profileBasics"'* ]]
          [[ "$HTML" == *'id="profilePrompt"'* ]]
          [[ "$HTML" == *'id="profilePreview"'* ]]
          [[ "$HTML" == *'id="discover"'* ]]
          [[ "$HTML" == *'id="chats"'* ]]
          [[ "$HTML" == *'id="myProfile"'* ]]
          [[ "$HTML" != *"9:41"* ]]
          JS=$(curl -fsS --max-time 30 "$URL/app.js")
          [[ "$JS" == *"mk_profile_v12"* ]]
          [[ "$JS" == *"main_photo_validated"* ]]
          CSS=$(curl -fsS --max-time 30 "$URL/app-extra.css")
          [[ "$CSS" == *".heart-zone"* ]]
          [[ "$CSS" == *"background:transparent!important"* ]]
