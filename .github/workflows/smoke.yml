name: Public smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for service and verify health
        run: |
          set -euo pipefail
          URL="https://minukimi-ux-test.onrender.com"
          for i in {1..18}; do
            BODY=$(curl -fsS --max-time 20 "$URL/api/health" || true)
            if [[ "$BODY" == *'"ok": true'* && "$BODY" == *'"database": "postgres"'* ]]; then
              echo "$BODY"
              break
            fi
            if [ "$i" -eq 18 ]; then
              echo "Health check failed: $BODY"
              exit 1
            fi
            sleep 10
          done
      - name: Verify tester page and v0.8 UI
        run: |
          set -euo pipefail
          HTML=$(curl -fsS --max-time 30 https://minukimi-ux-test.onrender.com/)
          [[ "$HTML" == *"MINUKIMI"* ]]
          [[ "$HTML" == *"In my head, I’m"* ]]
          [[ "$HTML" == *'data-ui-patch="full-v4"'* ]]
          [[ "$HTML" == *'id="profilePhoto"'* ]]
          [[ "$HTML" == *'id="profileBasics"'* ]]
          [[ "$HTML" == *'id="profilePrompt"'* ]]
          [[ "$HTML" == *'id="profilePreview"'* ]]
          [[ "$HTML" == *"Exactly one human face"* || "$HTML" == *"exactly one human face"* ]]
          [[ "$HTML" == *"I see it."* ]]
          [[ "$HTML" == *"Saving your responses"* ]]
          [[ "$HTML" != *"For the researcher:"* ]]
      - name: Verify service worker freshness policy
        run: |
          set -euo pipefail
          SW=$(curl -fsS --max-time 30 https://minukimi-ux-test.onrender.com/sw.js)
          [[ "$SW" == *"minukimi-shell-v3"* ]]
          [[ "$SW" == *"cache:'no-store'"* ]]
      - name: Verify research dashboard
        run: |
          set -euo pipefail
          HTML=$(curl -fsS --max-time 30 https://minukimi-ux-test.onrender.com/dashboard.html)
          [[ "$HTML" == *"Research dashboard"* ]]
          [[ "$HTML" == *"Admin token"* ]]
