name: Browser E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.51.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Browser flow
        run: |
          cat > e2e.js <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const { execSync } = require('child_process');
          const assert = (v,m)=>{ if(!v) throw new Error(m); };
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.route('https://geocoding-api.open-meteo.com/**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({results:[{name:'Lisbon',admin1:'Lisbon',country:'Portugal'}]})}));
            await page.goto('https://minukimi-ux-test.onrender.com/',{waitUntil:'networkidle',timeout:90000});
            assert(await page.locator('body').getAttribute('data-ui-patch')==='full-v4','v4 marker missing');
            assert(await page.locator('body').getAttribute('data-ui-v09')==='true','v0.9 marker missing');
            const bodyText=await page.locator('body').innerText();
            assert(!bodyText.includes('—')&&!bodyText.includes('–'),'long dash remains in visible copy');
            assert(await page.locator('.status').evaluateAll(els=>els.every(el=>getComputedStyle(el).display==='none')),'fake time/status chrome still visible');

            await page.locator('#splash button.cta').click();
            assert(await page.locator('#on1').evaluate(el=>el.classList.contains('active')),'intro 2 did not open');
            assert((await page.locator('#on1').innerText()).includes('Finish the sentence'),'prompt meaning missing');
            await page.locator('#on1 button.cta').click();
            assert(await page.locator('#on2').evaluate(el=>el.classList.contains('active')),'gesture intro did not open');
            const gestureIntro=await page.locator('#on2').innerText();
            assert(gestureIntro.includes('Like them?')&&gestureIntro.includes('Not for you?'),'gesture tutorial does not teach both choices');
            await page.locator('#on2 button.cta').click();

            await page.selectOption('#ageGroup','30-34');
            await page.locator('#frequencyChoice button[data-v="sometimes"]').click();
            await page.locator('#intake .cta').click();
            await page.waitForSelector('#profilePhoto.active');
            assert((await page.locator('#profilePhoto').innerText()).includes('One clear face only'),'main photo rule missing');

            fs.writeFileSync('noface.svg','<svg xmlns="http://www.w3.org/2000/svg" width="500" height="700"><rect width="500" height="700" fill="#ddd"/></svg>');
            await page.setInputFiles('#mkPhotoInput','noface.svg');
            await page.waitForFunction(()=>document.querySelector('#mkPhotoStatus')?.textContent.includes('No clear human face')||document.querySelector('#mkPhotoStatus')?.textContent.includes('Face check could not start'),{timeout:45000});
            assert(await page.locator('#mkPhotoNext').isDisabled(),'no-face image was accepted');

            execSync("curl -fsSL 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=80' -o face.jpg");
            await page.setInputFiles('#mkPhotoInput','face.jpg');
            await page.waitForFunction(()=>document.querySelector('#mkPhotoStatus')?.textContent.startsWith('Good.'),{timeout:45000});
            assert(!(await page.locator('#mkPhotoNext').isDisabled()),'human face did not pass gate');
            await page.locator('#mkPhotoNext').click();

            await page.fill('#mkName','Alex');
            await page.fill('#mkAge','34');
            await page.fill('#mkCity','Lis');
            await page.waitForSelector('#mkCitySuggestions.show .city-option',{timeout:5000});
            await page.locator('#mkCitySuggestions .city-option').first().click();
            assert((await page.inputValue('#mkCity')).includes('Lisbon'),'city was not normalized from suggestions');
            await page.selectOption('#mkLooking','Everyone');
            await page.selectOption('#mkGoal','Long-term, open to see');
            await page.locator('#profileBasics .cta').click();
            await page.fill('#mkPrompt','already living near the sea, wearing linen and kissing first.');
            await page.locator('#profilePrompt .cta').click();
            await page.waitForSelector('#profilePreview.active');
            assert((await page.locator('#mkPreviewPrompt').innerText()).length>10,'profile preview prompt missing');
            await page.locator('#profilePreview .cta').click();
            await page.waitForSelector('#discover.active');

            const promptSize=await page.locator('.prompt .text').first().evaluate(el=>parseFloat(getComputedStyle(el).fontSize));
            assert(promptSize<=14,'prompt typography is still too large');
            assert((await page.locator('.handle-mark').first().evaluate(el=>getComputedStyle(el).display))==='none','gesture artifact marks still visible');
            const cardBox=await page.locator('.profile-card').boundingBox();
            const contentBox=await page.locator('.card-content').boundingBox();
            const footerBox=await page.locator('.card-footer').boundingBox();
            assert(Math.abs(contentBox.x-footerBox.x)<2,'connect panel is not aligned with profile info');
            assert(footerBox.width < cardBox.width,'connect panel should sit inside the card edges');
            await page.locator('.connect-fallback').first().click();
            await page.waitForSelector('#toast.show');
            assert((await page.locator('#toast').innerText())==='I see it.','connect toast missing');
            assert(await page.locator('#toast .mk-toast-spark').count()>=4,'connect confirmation sparks missing');
            await page.waitForTimeout(1200);
            assert(await page.locator('#toast').evaluate(el=>el.classList.contains('show')),'toast disappears too fast');
            await browser.close();
            console.log('MINUKIMI v0.9 browser E2E passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node e2e.js
