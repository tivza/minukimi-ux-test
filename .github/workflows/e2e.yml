name: Browser E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.51.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Browser flow
        run: |
          cat > e2e.js <<'EOF'
          const { chromium } = require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('https://minukimi-ux-test.onrender.com/',{waitUntil:'networkidle',timeout:90000});
            assert(await page.locator('body').getAttribute('data-ui-v11')==='true','v1.1 shell missing');
            const text=await page.locator('body').innerText();
            assert(text.includes('Someone you haven\'t met yet.'),'onboarding missing');
            assert(!text.includes('9:41'),'fake time remains');
            await page.locator('#on1 .cta').click();
            await page.locator('#on2 .cta').click();
            assert((await page.locator('#on3').innerText()).includes("Don't swipe right. Connect."),'gesture onboarding missing');
            await page.locator('#on3 .cta').click();
            await page.waitForSelector('#profilePhoto.active');
            assert((await page.locator('#profilePhoto').innerText()).includes('One clear face'),'photo rule missing');
            await page.evaluate(()=>{
              localStorage.setItem('mk_onboarded_v11','1');
              localStorage.setItem('mk_profile_v11',JSON.stringify({name:'Alex',age:'34',city:'Lisbon, Portugal',job:'Designer',looking:'Everyone',goal:'Long-term relationship',prompt:'already living near the sea and learning to surf.',photo:''}));
            });
            await page.reload({waitUntil:'networkidle'});
            await page.waitForSelector('#discover.active');
            assert(await page.locator('.profile-card').count()===1,'discovery card missing');
            assert(await page.locator('.live-heart .half.left').count()===1,'signature left half missing');
            assert(await page.locator('.live-heart .half.right').count()===1,'signature right half missing');
            const bg=await page.locator('.heart-zone').evaluate(el=>getComputedStyle(el).backgroundColor);
            assert(bg==='rgba(0, 0, 0, 0)','heart has a matte panel');
            await page.locator('.connect-pill').click();
            await page.waitForSelector('#toast.show',{timeout:3000});
            assert((await page.locator('#toast').innerText()).includes('I see it.'),'connect reward missing');
            await page.locator('[data-nav="myProfile"]').click();
            await page.waitForSelector('#myProfile.active');
            assert((await page.locator('#myProfile').innerText()).includes('Edit profile'),'my profile screen missing');
            await browser.close();
            console.log('MINUKIMI v1.1 E2E passed');
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node e2e.js
