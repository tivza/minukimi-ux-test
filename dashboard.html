<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINUKIMI Research Dashboard</title><style>
:root{--bg:#f7f8ff;--paper:#fff;--ink:#232532;--muted:#7b7e8d;--border:rgba(35,37,50,.09);--purple:#7c68e8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbfbff,#f5f7ff);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}header{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.24em;font-size:13px}h1{font-family:Georgia,serif;font-size:42px;font-weight:500;letter-spacing:-.03em;margin:10px 0 6px}p{color:var(--muted);line-height:1.5}.tools{display:flex;gap:9px;flex-wrap:wrap}button,.file{border:1px solid var(--border);background:#fff;border-radius:14px;padding:11px 14px;font-weight:700;color:#5b5f70;cursor:pointer}.primary{background:#2c2e3b;color:#fff}input[type=file]{display:none}.cards{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px;margin:22px 0}.metric{background:#fff;border:1px solid var(--border);border-radius:18px;padding:15px;box-shadow:0 8px 28px rgba(65,55,115,.06)}.metric b{font-family:Georgia,serif;font-size:30px;font-weight:500;display:block}.metric span{font-size:11px;color:var(--muted)}section{background:#fff;border:1px solid var(--border);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 28px rgba(65,55,115,.05)}h2{font-size:18px;margin:0 0 14px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #eeeef5;vertical-align:top}th{color:#777a89;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.good{color:#3b806d}.warn{color:#a46738}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.empty{padding:50px 10px;text-align:center;color:var(--muted)}.tag{display:inline-block;background:#f1efff;color:#6552ba;border-radius:999px;padding:5px 8px;font-size:10px;margin:2px}textarea{width:100%;min-height:120px;border:1px solid var(--border);border-radius:14px;padding:12px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.tablewrap{overflow:auto}}
.token{border:1px solid var(--border);background:#fff;border-radius:14px;padding:11px 14px;color:#5b5f70;min-width:190px}.statusline{font-size:12px;color:var(--muted);margin-top:8px}</style></head><body><div class="wrap"><header><div><div class="brand">MINUKIMI</div><h1>Research dashboard</h1><p>Load completed v0.7 sessions from the research server. Local JSON import remains available as a backup.</p></div><div><div class="tools"><input class="token" id="adminToken" type="password" placeholder="Admin token"><button class="primary" onclick="loadServer()">Refresh server</button><label class="file">Import JSON<input id="files" type="file" accept="application/json,.json" multiple></label><button onclick="loadLocal()">Load local</button><button onclick="clearAll()">Clear</button><button onclick="exportCSV()">Export loaded CSV</button></div><div class="statusline" id="serverStatus">Server not loaded yet.</div></div></header><div id="content"><div class="empty">No sessions loaded yet.</div></div></div><script>
const baseProfiles=[
  {id:'p01',name:'Maya',age:31,city:'London',job:'Product designer',condition:'prompt',text:'the woman who moves to Lisbon for six months and finally learns to surf.',focus:'50% 20%',zoom:'1.00',photo:'https://images.unsplash.com/photo-1748865002392-d914228b77c4?auto=format&fit=crop&fm=jpg&ixid=NHwxMjA3fDA%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'c01',name:'Rose',age:28,city:'London',job:'Marketing manager',condition:'control',text:'Rooftop drinks, spontaneous weekends away and people who can actually pick a restaurant.',focus:'50% 22%',zoom:'1.01',photo:'https://images.unsplash.com/photo-1500771181897-517651ae4eda?auto=format&fit=crop&fm=jpg&ixid=NHwxMjA3fDA%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'c02',name:'Blake',age:33,city:'Dublin',job:'Software engineer',condition:'control',text:'Gym three times a week, sci-fi far too often, learning how not to look at a screen after 10pm.',focus:'50% 22%',zoom:'1.00',photo:'https://images.unsplash.com/photo-1756561878440-5601ada5f0c9?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'p02',name:'Daniel',age:38,city:'London',job:'Architect',condition:'prompt',text:'calmer, braver, and the man people call when something goes wrong.',focus:'50% 18%',zoom:'1.00',photo:'https://images.unsplash.com/photo-1771956649356-51ed722e59bf?auto=format&fit=crop&fm=jpg&ixid=NHwxMjA3fDA%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'p03',name:'Lina',age:29,city:'Barcelona',job:'Producer',condition:'prompt',text:'already living near the sea, wearing linen and kissing first.',focus:'50% 18%',zoom:'1.01',photo:'https://images.unsplash.com/photo-1676229155368-d7830dd02d04?auto=format&fit=crop&fm=jpg&ixid=NHwxMjA3fDA%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'c03',name:'Joanna',age:36,city:'Prague',job:'Lawyer',condition:'control',text:'Old cities, long dinners and people who have something to say after the first drink.',focus:'50% 21%',zoom:'1.01',photo:'https://images.unsplash.com/photo-1757348665310-0b68ed0ebc30?auto=format&fit=crop&fm=jpg&ixid=NHwxMjA3fDA%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'p04',name:'Ethan',age:34,city:'Amsterdam',job:'Sound engineer',condition:'prompt',text:'the version of me that disappears for three days and comes back clearer.',focus:'50% 20%',zoom:'1.00',photo:'https://images.unsplash.com/photo-1744551154690-fb14ef828a39?auto=format&fit=crop&fm=jpg&ixid=NHwxMjA3fDA%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'c04',name:'Nicky',age:30,city:'Berlin',job:'Event producer',condition:'control',text:'Night owl, coffee addict, much easier to understand in person than in a bio.',focus:'50% 22%',zoom:'1.00',photo:'https://images.unsplash.com/photo-1649675728586-647922b8ed7b?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'p05',name:'Nora',age:40,city:'Copenhagen',job:'Psychotherapist',condition:'prompt',text:'less careful, more sun-warmed, and the person who says yes before overthinking.',focus:'50% 22%',zoom:'1.00',photo:'https://images.unsplash.com/photo-1733971717497-6835242a3e09?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'c05',name:'Claire',age:39,city:'Brussels',job:'Art teacher',condition:'control',text:'Kindness, stupid jokes, slow mornings and someone who doesn’t need every weekend planned.',focus:'50% 18%',zoom:'1.00',photo:'https://images.unsplash.com/photo-1776269077087-7164855205c1?auto=format&fit=crop&fm=jpg&ixid=NHwxMjA3fDA%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'p06',name:'Sam',age:30,city:'Lisbon',job:'Photographer',condition:'prompt',text:'already halfway through another life, carrying one bag and no backup plan.',focus:'50% 18%',zoom:'1.00',photo:'https://images.unsplash.com/photo-1684327596702-6bbbe1422375?auto=format&fit=crop&fm=jpg&ixid=NHwxMjA3fDA%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'c06',name:'Adrian',age:35,city:'Vienna',job:'Journalist',condition:'control',text:'Books, cycling and dinners that somehow turn into two-hour walks.',focus:'50% 19%',zoom:'1.02',photo:'https://images.unsplash.com/photo-1512441944949-3d243fe34329?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'p07',name:'Anna',age:37,city:'Warsaw',job:'HR lead',condition:'prompt',text:'the woman who swims at night and never asks permission.',focus:'50% 20%',zoom:'1.00',photo:'https://images.unsplash.com/photo-1706951413911-a4477e18ccd5?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'c07',name:'Kayleigh',age:29,city:'Edinburgh',job:'Travel consultant',condition:'control',text:'Half planner, half chaos. Usually hungry.',focus:'50% 21%',zoom:'1.00',photo:'https://images.unsplash.com/photo-1758764340880-d0d5c64e348a?auto=format&fit=crop&fm=jpg&ixid=NHwxMjA3fDA%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'p08',name:'Leo',age:32,city:'Milan',job:'Chef',condition:'prompt',text:'the guy who lives above a tiny restaurant and smells like smoke, citrus and trouble.',focus:'50% 17%',zoom:'1.00',photo:'https://images.unsplash.com/photo-1781040493581-c598e3110b0a?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'c08',name:'Omar',age:42,city:'London',job:'Restaurant owner',condition:'control',text:'Early mornings, big family, proper Sundays and no interest in texting for three months before meeting.',focus:'50% 17%',zoom:'1.00',photo:'https://images.unsplash.com/photo-1681148331577-50ce68c7763c?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=72&w=1200'},
  {id:'p09',name:'Sara',age:35,city:'Paris',job:'Editor',condition:'prompt',text:'the person who leaves dinner parties early to catch the last train somewhere better.',focus:'50% 20%',zoom:'1.00',photo:'https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=1200&q=78'},
  {id:'c09',name:'Iris',age:32,city:'Rotterdam',job:'UX researcher',condition:'control',text:'Good questions, terrible dancing and trains that take longer than flying.',focus:'50% 18%',zoom:'1.01',photo:'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?auto=format&fit=crop&w=1200&q=78'},
  {id:'p10',name:'Mark',age:41,city:'Manchester',job:'Accountant',condition:'prompt',text:'leaner, steadier, and the man who finally stops postponing his real life.',focus:'50% 18%',zoom:'1.00',photo:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=1200&q=78'},
  {id:'c10',name:'Tom',age:37,city:'Stockholm',job:'Civil engineer',condition:'control',text:'Looking for something real. Prefer meeting to endless messaging. Ski badly but enthusiastically.',focus:'50% 17%',zoom:'1.00',photo:'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=1200&q=78'}
];
let sessions=[];
const byId=Object.fromEntries(baseProfiles.map(p=>[p.id,p]));
document.getElementById('files').addEventListener('change',async e=>{for(const f of e.target.files){try{const j=JSON.parse(await f.text());if(j&&j.id&&!sessions.some(s=>s.id===j.id))sessions.push(j)}catch(err){}}render();e.target.value=''});
async function loadServer(){const token=document.getElementById('adminToken').value.trim();const st=document.getElementById('serverStatus');st.textContent='Loading…';try{const r=await fetch('/api/sessions',{headers:{'X-Admin-Token':token}});if(!r.ok)throw new Error(r.status===401?'Wrong admin token':'HTTP '+r.status);const j=await r.json();sessions=(j.sessions||[]).filter(Boolean);localStorage.setItem('minukimi_admin_token',token);st.textContent=sessions.length+' sessions loaded from server.';render()}catch(e){st.textContent='Could not load server: '+e.message}}
const savedAdminToken=localStorage.getItem('minukimi_admin_token')||'';document.getElementById('adminToken').value=savedAdminToken;
function loadLocal(){try{const a=JSON.parse(localStorage.getItem('minukimi_research_sessions')||'[]');for(const j of a)if(j&&j.id&&!sessions.some(s=>s.id===j.id))sessions.push(j);render()}catch(e){}}
function clearAll(){sessions=[];render()}
function pct(n,d){return d?Math.round(n/d*100)+'%':'—'}
function avg(a){return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0}
function metric(label,val){return `<div class="metric"><b>${val}</b><span>${label}</span></div>`}
function conditionCount(ids,cond){const set=new Set(ids||[]);return baseProfiles.filter(p=>p.condition===cond&&set.has(p.id)).length}
function render(){const el=document.getElementById('content');if(!sessions.length){el.innerHTML='<div class="empty">No sessions loaded yet.</div>';return}const complete=sessions.filter(s=>s.completed!==false&&s.finished);let promptRecall=0,controlRecall=0,promptAgain=0,controlAgain=0,gestureConnect=0,buttonConnect=0,starts=0,abandons=0,returns={yes:0,maybe:0,no:0},dur=[];for(const s of complete){promptRecall+=conditionCount(s.remembered,'prompt');controlRecall+=conditionCount(s.remembered,'control');promptAgain+=conditionCount(s.seeAgain,'prompt');controlAgain+=conditionCount(s.seeAgain,'control');for(const e of s.events||[]){if(e.type==='connect'&&e.method==='gesture')gestureConnect++;if(e.type==='connect'&&e.method==='button')buttonConnect++;if(e.type==='gesture_start')starts++;if(e.type==='gesture_abandon')abandons++}if(s.returnChoice)returns[s.returnChoice]=(returns[s.returnChoice]||0)+1;if(s.duration_ms)dur.push(s.duration_ms)}const denom=complete.length*10;let out='<div class="cards">'+metric('completed sessions',complete.length)+metric('prompt recall',pct(promptRecall,denom))+metric('control recall',pct(controlRecall,denom))+metric('prompt see-again',pct(promptAgain,denom))+metric('control see-again',pct(controlAgain,denom))+metric('avg session time',dur.length?Math.round(avg(dur)/60000)+'m':'—')+'</div>';
out+=`<div class="grid2"><section><h2>Gesture behavior</h2><div class="cards" style="grid-template-columns:repeat(3,1fr);margin:0">${metric('gesture connects',gestureConnect)}${metric('button connects',buttonConnect)}${metric('gesture abandon rate',pct(abandons,starts))}</div></section><section><h2>Return tomorrow?</h2><div class="cards" style="grid-template-columns:repeat(3,1fr);margin:0">${metric('yes',returns.yes||0)}${metric('maybe',returns.maybe||0)}${metric('no',returns.no||0)}</div></section></div>`;
out+=profileTable(complete)+participantTable(complete)+answersTable(complete);el.innerHTML=out}
function profileTable(ss){let rows=baseProfiles.map(p=>{let shown=0,connect=0,pass=0,dw=[],rem=0,again=0;for(const s of ss){for(const e of s.events||[])if(e.profile===p.id){if(e.type==='shown')shown++;if(e.type==='connect'){connect++;if(e.dwell_ms)dw.push(e.dwell_ms)}if(e.type==='pass'){pass++;if(e.dwell_ms)dw.push(e.dwell_ms)}}if((s.remembered||[]).includes(p.id))rem++;if((s.seeAgain||[]).includes(p.id))again++}return `<tr><td><b>${p.name}, ${p.age}</b><br><span class="tag">${p.condition}</span></td><td>${pct(connect,Math.max(1,connect+pass))}</td><td>${pct(rem,ss.length)}</td><td>${pct(again,ss.length)}</td><td>${dw.length?(avg(dw)/1000).toFixed(1)+'s':'—'}</td><td>${p.text}</td></tr>`}).join('');return `<section><h2>Profile performance</h2><div class="tablewrap"><table><thead><tr><th>Profile</th><th>Connect rate</th><th>Recall</th><th>See again</th><th>Dwell</th><th>Text</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}
function participantTable(ss){const counts={};for(const s of ss){const p=s.participant||{};const k=(p.ageGroup||'Unknown')+' · '+(p.gender||'Unknown');counts[k]=(counts[k]||0)+1}const rows=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');return `<section><h2>Participants</h2><div class="tablewrap"><table><thead><tr><th>Group</th><th>Sessions</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}
function answersTable(ss){const rows=ss.map(s=>`<tr><td>${s.id}</td><td>${(s.participant?.ageGroup||'—')}</td><td>${s.gestureChoice||'—'}</td><td>${s.returnChoice||'—'}</td><td>${esc(s.memoryText||'')}</td><td>${esc(s.ownPrompt||'')}</td></tr>`).join('');return `<section><h2>Open responses</h2><div class="tablewrap"><table><thead><tr><th>Session</th><th>Age</th><th>Preferred action</th><th>Return</th><th>What they remembered</th><th>In my head…</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function exportCSV(){if(!sessions.length)return;const header=['id','age_group','gender','apps','frequency','gesture_choice','return_choice','remembered_prompt','remembered_control','see_again_prompt','see_again_control','duration_ms','memory_text','own_prompt'];const lines=[header.join(',')];for(const s of sessions){const row=[s.id,s.participant?.ageGroup||'',s.participant?.gender||'',(s.participant?.apps||[]).join('|'),s.participant?.frequency||'',s.gestureChoice||'',s.returnChoice||'',conditionCount(s.remembered,'prompt'),conditionCount(s.remembered,'control'),conditionCount(s.seeAgain,'prompt'),conditionCount(s.seeAgain,'control'),s.duration_ms||'',s.memoryText||'',s.ownPrompt||''].map(v=>'"'+String(v).replace(/"/g,'""')+'"');lines.push(row.join(','))}const blob=new Blob([lines.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='minukimi_research_summary.csv';a.click();URL.revokeObjectURL(a.href)}
</script></body></html>
