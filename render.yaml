services:
  - type: web
    name: minukimi-ux-test
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: minukimi-ux-db
          property: connectionString

databases:
  - name: minukimi-ux-db
    plan: free
    databaseName: minukimi
    user: minukimi
    ipAllowList: []
